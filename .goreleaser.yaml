version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

checksum:
  name_template: checksums.txt

# Overwrite existing assets so a rerun of a partially failed release does not
# fail with "already_exists".
release:
  mode: replace
